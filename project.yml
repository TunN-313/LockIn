name: LockIn
options:
  bundleIdPrefix: com.lockin
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 5 language mode (SE-0441); phiên bản compiler Swift 5.10+ xác minh riêng bằng `swift --version` trên CI.
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    LOCKIN_BUNDLE_ID: com.lockin.app
    LOCKIN_APP_GROUP_ID: group.com.lockin.shared
    GENERATE_INFOPLIST_FILE: NO

targets:
  LockInApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
        excludes:
          - "Config/*.plist"
          - "Config/*.entitlements"
      - path: Backend
      - path: Frontend
    dependencies:
      - target: LockInWidgetsExtension
        embed: true
    info:
      path: Shared/Config/LockInApp-Info.plist
      properties:
        CFBundleDisplayName: LockIn
        LockInAppGroupIdentifier: "$(LOCKIN_APP_GROUP_ID)"
        NSFaceIDUsageDescription: "LockIn sử dụng Face ID để mở khóa ứng dụng và bảo vệ dữ liệu học tập cục bộ của bạn."
        NSPhotoLibraryAddUsageDescription: "LockIn cần quyền thêm ảnh để lưu hình nền tóm tắt bài ôn vào Thư viện ảnh của bạn."
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Shared/Config/LockInApp.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(LOCKIN_APP_GROUP_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LOCKIN_BUNDLE_ID)"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_STRICT_CONCURRENCY: minimal

  LockInWidgetsExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
        excludes:
          - "Config/*.plist"
          - "Config/*.entitlements"
      - path: LockInWidgetsExtension
    info:
      path: Shared/Config/LockInWidgetsExtension-Info.plist
      properties:
        CFBundleDisplayName: LockIn Widgets
        LockInAppGroupIdentifier: "$(LOCKIN_APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Shared/Config/LockInWidgetsExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(LOCKIN_APP_GROUP_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LOCKIN_BUNDLE_ID).widgets"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: minimal

  LockInTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LockInTests
    dependencies:
      - target: LockInApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LOCKIN_BUNDLE_ID).tests"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  LockInApp:
    build:
      targets:
        LockInApp: all
        LockInWidgetsExtension: all
    test:
      targets:
        - LockInTests
  LockInWidgetsExtension:
    build:
      targets:
        LockInWidgetsExtension: all
