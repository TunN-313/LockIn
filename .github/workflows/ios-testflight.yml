name: iOS TestFlight Distribution (Phase 2)

on:
  workflow_dispatch:

jobs:
  testflight-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Xcode & install XcodeGen
        run: |
          ls -d /Applications/Xcode*.app || true
          xcode-select -p
          xcodebuild -version
          swift --version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: Install Apple Distribution Certificate & Provisioning Profiles
        env:
          APPLE_DIST_CERT_BASE64: ${{ secrets.APPLE_DIST_CERT_BASE64 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.RUNNER_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_DIST_CERT_BASE64"
          test -n "$APPLE_DIST_CERT_PASSWORD"
          test -n "$APP_PROVISIONING_PROFILE_BASE64"
          test -n "$WIDGET_PROVISIONING_PROFILE_BASE64"
          test -n "$KEYCHAIN_PASSWORD"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_DIST_CERT_BASE64" | base64 --decode > cert.p12
          echo "$APP_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/lockin_app.mobileprovision
          echo "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/lockin_widgets.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f cert.p12

      - name: Archive & Export IPA for App Store Connect
        env:
          APP_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.APP_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          test -n "$APP_EXPORT_OPTIONS_PLIST_BASE64"
          echo "$APP_EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > ExportOptions.plist
          xcodebuild archive \
            -project LockIn.xcodeproj \
            -scheme LockInApp \
            -configuration Release \
            -archivePath build/LockIn.xcarchive

          xcodebuild -exportArchive \
            -archivePath build/LockIn.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_BASE64"
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app \
            -f build/export/LockInApp.ipa \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up temporary signing credentials
        if: always()
        run: |
          rm -f cert.p12 ExportOptions.plist
          security delete-keychain build.keychain || true
          rm -f ~/Library/Keychains/build.keychain-db
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
